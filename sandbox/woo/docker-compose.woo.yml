# Sandbox WooCommerce do testów adaptera StorePlatform (AD-8, AD-20).
# Uruchamiany osobno od bazy aplikacji: to jest atrapa sklepu klienta, nie część produktu.
services:
  woo-db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - woodb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  woo:
    image: wordpress:6-php8.3-apache
    depends_on:
      woo-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: woo-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
    ports:
      - "127.0.0.1:8091:80"
    volumes:
      - woofiles:/var/www/html

  # wp-cli w tym samym kontekście plików co WordPress
  woo-cli:
    image: wordpress:cli-php8.3
    depends_on:
      - woo
    environment:
      WORDPRESS_DB_HOST: woo-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - woofiles:/var/www/html
    user: "33:33"
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  woodb:
  woofiles:
